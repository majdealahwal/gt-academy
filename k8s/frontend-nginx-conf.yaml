apiVersion: v1
data:
  nginx.conf: |
    server {
        listen 80;

        location /api/ {
            proxy_pass http://backend.gt-academy.svc.cluster.local:3000/api/;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri /index.html;
        }
    }
kind: ConfigMap
metadata:
  name: frontend-nginx-conf
  namespace: gt-academy
